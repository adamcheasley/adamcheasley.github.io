<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Some Place Nice</title>
  <meta name="description" content="Some Place Nice, a journal of strange art and weird places. Coming soon.">

  <style>
    :root {
      color-scheme: light;
      --bg: #f2efe8;
      --text: #171717;
      --muted: #6f6a61;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: clamp(2rem, 7vw, 7rem);
    }

    .intro {
      max-width: 72rem;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 34rem;
      margin: 2.25rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    @media (max-width: 600px) {
      main {
        align-items: flex-end;
        padding-bottom: 3rem;
      }

      p {
        margin-top: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <h1>Some Place Nice</h1>
      <p>An independent platform for artists and ideas. Coming soon.</p>
    </section>
  </main>
</body>
</html>
